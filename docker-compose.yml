# DownVid 容器编排（根目录薄入口，实际配置收纳在 docker/ 目录中）。
#
# 用法：
#   docker compose up -d          # 启动 WebUI（浏览器访问 http://127.0.0.1:6080/）
#   docker compose logs -f        # 查看运行日志
#   docker compose down           # 停止服务

services:
  downvid:
    # 优先用 GHCR 上的官方多架构镜像（docker compose pull 一条命令升级）；
    # 想从源码构建就在同一条命令里加 --build，或用 docker/Dockerfile 手动构建。
    image: ${DOWNVID_IMAGE:-ghcr.io/downvid/downvid:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: downvid
    restart: unless-stopped
    ports:
      - "${DOWNVID_HTTP_PORT:-6080}:6080"
    volumes:
      - ./data/downloads:/data/downloads
      - ./data/userdata:/data/userdata
    environment:
      DOWNVID_HOME: /data
      DOWNVID_DATA_DIR: /data/userdata
      DOWNVID_DOWNLOADS: /data/downloads
      DOWNVID_WEB_HOST: 0.0.0.0
      # 镜像名：容器版的更新检查靠它问 registry 有没有新 digest，
      # 「升级命令」里也会原样回显这个名字
      DOWNVID_IMAGE: ${DOWNVID_IMAGE:-ghcr.io/downvid/downvid:latest}
      # 更新源：auto / github / jsdelivr / ghproxy / gitee / website
      # （镜像内不写死，留给用户在设置界面或这里改 —— 更新通道本身就是最需要能换路的一条）
      DOWNVID_UPDATE_SOURCE: ${DOWNVID_UPDATE_SOURCE:-auto}
      TZ: "${TZ:-Asia/Shanghai}"
    # 镜像里已有 HEALTHCHECK，这里只覆盖启动等待时间（首次启动要解压依赖）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
