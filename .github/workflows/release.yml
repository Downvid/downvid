name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # 也可在 Actions 页面手动发布：填写版本号（须与 package.json 一致），由工作流创建 v<版本号> tag
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.2.0，留空则只构建不发布）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          PKG=$(node -p "require('./package.json').version")
          if [ -n "$VERSION" ] && [ "$VERSION" != "$PKG" ]; then
            echo "::error::发布版本 $VERSION 与 package.json 版本 $PKG 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-mac-arm64:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64-builds
          path: |
            release/**/*-arm64-Mac-*.dmg
            release/**/*-arm64-Mac-*.zip
            release/**/latest-mac.yml
            release/**/*.blockmap
          retention-days: 7

  build-mac-x64:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:mac:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-x64-builds
          path: |
            release/**/*-x64-Mac-*.dmg
            release/**/*-x64-Mac-*.zip
            release/**/latest-mac.yml
            release/**/*.blockmap
          retention-days: 7

  build-win:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_HTTP_TIMEOUT: 600000
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-builds
          path: |
            release/**/DownVid-Setup-*.exe
            release/**/DownVid-Portable-*.exe
            release/**/latest.yml
            release/**/*.blockmap
          retention-days: 7

  build-linux-x64:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        target: [appimage, deb, rpm, tar.gz]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:linux:x64:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-${{ matrix.target }}
          path: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*-Linux-*.tar.gz
            release/**/*.blockmap
          retention-days: 7

  build-linux-arm64:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:linux:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-builds
          path: |
            release/**/*-Linux-*.AppImage
            release/**/*-Linux-*.tar.gz
            release/**/latest-linux-arm64.yml
            release/**/*.blockmap
          retention-days: 7

  release:
    needs: [version, build-mac-arm64, build-mac-x64, build-win, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.version.outputs.version != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 各 job 生成的 latest*.yml 汇总时会互相覆盖，按最终上传的文件重新生成
      - name: Generate update manifests
        run: node scripts/gen-update-manifests.mjs artifacts "$VERSION"

      # 正文顶部生成「点徽章即下载」的引导区：Release 里 CHANGELOG 内容较长，
      # 此前不少用户拉到页面后不知道点哪里下载。下载链接按实际产物生成，
      # 不会出现指向不存在文件的死链。
      - name: Generate release notes
        id: changelog
        run: |
          node scripts/gen-release-notes.mjs artifacts "$VERSION" CHANGELOG.md > /tmp/release-notes.md
          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat /tmp/release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # 手动发布时 tag 尚不存在，由 action 在当前提交上创建
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/DownVid-Setup-*.exe
            artifacts/**/DownVid-Portable-*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/latest*.yml
            artifacts/**/*.blockmap
