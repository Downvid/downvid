name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # 也可在 Actions 页面手动发布：填写版本号（须与 package.json 一致），由工作流创建 v<版本号> tag
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.2.0，留空则只构建不发布）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布（测试版）：稳定用户的自动更新不会拿到它'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # 这里用 node 读 package.json 的版本号，必须显式装 Node：
      # runner 自带的版本随镜像变化，而版本号解析错了会直接发错版本
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: v
        name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          PKG=$(node -p "require('./package.json').version")
          if [ -n "$VERSION" ] && [ "$VERSION" != "$PKG" ]; then
            echo "::error::发布版本 $VERSION 与 package.json 版本 $PKG 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # 预发布：让「测试版本」不进稳定用户的更新通道。
          # 已实测确认（用 electron 自己的仓库对照）：GitHub 的 /releases/latest
          # 与 releases.atom 都会跳过标记为 prerelease 的版本，而 electron-updater
          # 正是靠这两个端点找最新版的，所以稳定用户不会被推到 beta 上。
          PRERELEASE="${{ inputs.prerelease }}"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          if [ "$PRERELEASE" = "true" ]; then
            echo "本次发布标记为**预发布**：稳定用户的自动更新不会拿到它"
          fi

  # ===== 发布门禁：全量测试 =====
  #
  # 发布是不可逆的：产物一旦推给用户，就只能靠下一个版本修回来，
  # 而「下一个版本」本身还得依赖更新通道是好的。所以这里把三平台的
  # 关键回归再跑一遍 —— 平时 CI 已经在跑，这里是**发布前的最后一道闸**，
  # 宁可晚发十分钟，也不要发一个用户装完用不了的版本。
  gate:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - name: Go 侧车（格式 / 静态检查 / 测试）
        working-directory: backend
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...
          go test -shuffle=on -count=1 ./...

      - name: 类型检查
        run: pnpm vue-tsc --noEmit

      - name: 契约与静态校验（IPC / 图标 / 官网 / 依赖清单）
        run: |
          pnpm lint:ipc
          pnpm lint:icons
          pnpm lint:website
          pnpm deps:manifest:check

      - name: 纯逻辑单测
        run: pnpm test

      # 更新流程与设置迁移：发布前必须确认这两层没坏
      - name: 更新流程回归
        run: pnpm test:updater

      - name: 设置迁移与向后兼容
        run: pnpm test:settings:migration

      - name: 下载与解析集成回归
        run: |
          pnpm test:download:integration
          pnpm test:parse:integration

      # 边车必须能编出全部 5 个平台：任一编不过，对应平台的用户就装不上
      - name: 交叉编译全部平台
        working-directory: backend
        shell: bash
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/downvid-deps
            echo "  ok ${target}"
          done

  build-mac-arm64:
    needs: [version, gate]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64-builds
          path: |
            release/**/*-arm64-Mac-*.dmg
            release/**/*-arm64-Mac-*.zip
            release/**/latest-mac.yml
            release/**/*.blockmap
          retention-days: 7

  build-mac-x64:
    needs: [version, gate]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:mac:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-x64-builds
          path: |
            release/**/*-x64-Mac-*.dmg
            release/**/*-x64-Mac-*.zip
            release/**/latest-mac.yml
            release/**/*.blockmap
          retention-days: 7

  build-win:
    needs: [version, gate]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_HTTP_TIMEOUT: 600000
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-builds
          path: |
            release/**/DownVid-Setup-*.exe
            release/**/DownVid-Portable-*.exe
            release/**/latest.yml
            release/**/*.blockmap
          retention-days: 7

  build-linux-x64:
    needs: [version, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        target: [appimage, deb, rpm, tar.gz]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:linux:x64:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-${{ matrix.target }}
          path: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*-Linux-*.tar.gz
            release/**/*.blockmap
          retention-days: 7

  build-linux-arm64:
    needs: [version, gate]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:linux:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-builds
          path: |
            release/**/*-Linux-*.AppImage
            release/**/*-Linux-*.tar.gz
            release/**/latest-linux-arm64.yml
            release/**/*.blockmap
          retention-days: 7

  release:
    needs: [version, build-mac-arm64, build-mac-x64, build-win, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.version.outputs.version != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 各 job 生成的 latest*.yml 汇总时会互相覆盖，按最终上传的文件重新生成
      - name: Generate update manifests
        run: node scripts/gen-update-manifests.mjs artifacts "$VERSION"

      # 正文顶部生成「点徽章即下载」的引导区：Release 里 CHANGELOG 内容较长，
      # 此前不少用户拉到页面后不知道点哪里下载。下载链接按实际产物生成，
      # 不会出现指向不存在文件的死链。
      - name: Generate release notes
        id: changelog
        run: |
          node scripts/gen-release-notes.mjs artifacts "$VERSION" CHANGELOG.md > /tmp/release-notes.md
          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat /tmp/release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # 手动发布时 tag 尚不存在，由 action 在当前提交上创建
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          # 预发布（测试版）：稳定用户的自动更新不会拿到它。
          # 由 workflow_dispatch 的 prerelease 输入决定；打 tag 触发时为 false。
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/DownVid-Setup-*.exe
            artifacts/**/DownVid-Portable-*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/latest*.yml
            artifacts/**/*.blockmap

      # 发布**完成后**回头核对一次：Release 真的存在、且带着全部平台的更新清单。
      # 为什么需要这一步：实测 `v1.3.5` 的 tag 推上去了、CHANGELOG 也写了，
      # 但这次运行在 3 分钟后**被取消**，于是 GitHub Release 里没有 v1.3.5，
      # 自动更新通道仍指向 v1.3.4 —— 所有存量用户永远收不到这次修复，
      # 而版本号已经继续往前走了。这种失败**没有任何提示**：
      # tag 在、CHANGELOG 在、package.json 也在，只有 Release 页面少了一条。
      #
      # 放在最后而不是依赖 job 的成功状态：被取消时后续步骤不执行，
      # 恰恰是我们希望有人（或下一个版本的发布）注意到的时刻。
      - name: 校验发布完整性
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release.mjs --tag "v${{ env.VERSION }}"

      # ===== 官网版本号：只在确认发布成功之后才刷 =====
      #
      # 官网是单文件、无构建，页面上的版本号只能是硬编码的：脚本拉到 releases/latest
      # 会覆盖成真实 tag，但离线 / 被限流 / 禁用 sessionStorage 时会退回那个写死的值。
      # 不刷新它不会报错，只会安静地过期——页面上写着 v1.3.4 而实际最新版是 v1.4.0。
      #
      # 顺序很关键：**发布失败时官网不该先跳到一个不存在的版本**。放在自检之后，
      # 写入的版本一定已经在 Releases 里（自检失败时这一步不会执行）。
      # 预发布也跳过：latest 通道拿不到 beta，官网显示 beta 号会误导稳定用户。
      - name: 刷新官网版本号
        if: needs.version.outputs.prerelease != 'true'
        run: |
          node scripts/sync-website-version.mjs "$VERSION"
          node scripts/lint-website.mjs

      - name: 提交回 main
        if: needs.version.outputs.prerelease != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # checkout 默认停在 tag 对应的游离 HEAD 上。这里显式挪到 origin/main 顶端再写，
          # 而不是 `git push HEAD:main`：打 tag 之后 main 若又往前走了（比如这条提交本身、
          # 或别人的 PR），直接推会被拒，官网版本号就静默停在上一个版本。
          git fetch origin main
          git checkout -B main origin/main
          # 重新写一次：origin/main 上的 index.html 可能是旧版本
          node scripts/sync-website-version.mjs "$VERSION"
          git add website/index.html
          if git diff --cached --quiet; then
            echo "官网版本号已是最新，无需提交"
            exit 0
          fi
          git commit -m "chore(website): 发布后同步官网版本号至 v$VERSION" -m "由 release.yml 在 Release 创建成功后自动写入，离线兜底值不再是过期的。"
          git push origin main
