name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # 也可在 Actions 页面手动发布：填写版本号（须与 package.json 一致），由工作流创建 v<版本号> tag
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.2.0，留空则只构建不发布）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布（测试版）：稳定用户的自动更新不会拿到它'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # 这里用 node 读 package.json 的版本号，必须显式装 Node：
      # runner 自带的版本随镜像变化，而版本号解析错了会直接发错版本
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: v
        name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          PKG=$(node -p "require('./package.json').version")
          if [ -n "$VERSION" ] && [ "$VERSION" != "$PKG" ]; then
            echo "::error::发布版本 $VERSION 与 package.json 版本 $PKG 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # 预发布：让「测试版本」不进稳定用户的更新通道。
          # GitHub 的 /releases/latest 与 releases.atom 都会跳过 prerelease，
          # 而应用内的自更新正是靠这两个端点找最新版。
          PRERELEASE="${{ inputs.prerelease }}"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          if [ "$PRERELEASE" = "true" ]; then
            echo "本次发布标记为**预发布**：稳定用户的自动更新不会拿到它"
          fi

  # ===== 发布门禁：全量测试 =====
  #
  # 发布是不可逆的：产物一旦推给用户，就只能靠下一个版本修回来，
  # 而「下一个版本」本身还得依赖更新通道是好的。所以这里把关键回归再跑一遍 ——
  # 平时 CI 已经在跑，这里是**发布前的最后一道闸**，宁可晚发十分钟，
  # 也不要发一个用户装完用不了的版本。
  gate:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - name: Go 侧车（格式 / 静态检查 / 测试）
        working-directory: backend
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...
          go test -shuffle=on -count=1 ./...

      # main.go 里有 `//go:embed all:frontend/dist`：目录不存在时 vet/测试直接编译失败
      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: Go 核心（格式 / 静态检查 / 测试）
        working-directory: app
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...
          go test -shuffle=on -count=1 ./...

      - name: 契约与静态校验（图标 / 官网 / 依赖清单 / 边界 / 文档）
        run: |
          pnpm lint:icons
          pnpm lint:website
          pnpm lint:boundaries
          pnpm lint:docs
          pnpm lint:workflows
          pnpm deps:manifest:check
          pnpm sync:repo
          pnpm sync:changelog

      - name: 纯逻辑单测
        run: pnpm test

      # 边车必须能编出全部 5 个平台：任一编不过，对应平台的用户就装不上
      - name: 交叉编译全部平台
        working-directory: backend
        shell: bash
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/downvid-deps
            echo "  ok ${target}"
          done

  # ===== 三平台构建 =====
  #
  # 产物命名 `DownVid-Wails-<平台>-<版本>.<ext>` 同时出现在三处：
  #   · 本工作流的打包步骤
  #   · `app/internal/update/migration.go`（识别安装包）
  #   · `website/app.js`（官网直链下载）与 `scripts/gen-release-notes.mjs`
  # 改一处必须改四处，`pnpm lint:website` 会拦官网那一侧。
  build-wails:
    needs: [version, gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            suffix: mac-universal
          - os: windows-latest
            platform: windows/amd64
            suffix: windows-x64
          - os: ubuntu-22.04
            platform: linux/amd64
            suffix: linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      # Linux 构建 Wails 需要 cgo 链接 GTK / WebKit。
      #
      # ## 为什么是 4.0 而不是 4.1
      #
      # Wails v2.16 的 cgo 指令默认要 `webkit2gtk-4.0`：
      #
      #     #cgo !webkit2_41 pkg-config: webkit2gtk-4.0
      #     #cgo  webkit2_41 pkg-config: webkit2gtk-4.1
      #
      # 只有加 `-tags webkit2_41` 才用 4.1。装了 4.1 却没加 tag 时，
      # pkg-config 找不到 4.0 —— 而报错信息只说「Package webkit2gtk-4.0
      # was not found」，不会告诉你是 tag 的问题。
      #
      # 这里选 4.0：它是 Wails 的默认路径，不需要额外 tag，少一个变量。
      # 全部依赖（grep 出所有 pkg-config 指令后去重）：gtk+-3.0 / gio-unix-2.0 /
      # webkit2gtk-4.0；libsoup-2.4 由 libwebkit2gtk-4.0-dev 传递引入。
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install frontend deps
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      # wailsjs/ 是 `wails generate module` 生成的、不入库。
      # 不生成就直接构建，前端会因为找不到 `../../wailsjs/go/main/App` 而失败：
      #   Could not resolve "../../wailsjs/go/main/App" from "src/lib/backend.ts"
      #
      # **顺序不能反**：`wails generate module` 会先把 Go 包编译一遍，
      # 而 main.go 里有 `//go:embed all:frontend/dist` —— dist 不存在时
      # 直接报 `pattern all:frontend/dist: no matching files found`。
      # 所以要先准备 embed 目录，再生成绑定。
      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定（wailsjs）
        working-directory: app
        run: wails generate module

      # 必须用 build.sh：它先把依赖边车编译好再带 `-tags withsidecar` 构建。
      # 直接 `wails build` 出来的应用**没有依赖探测能力**（边车不在包里），
      # 用户看到的是「依赖页只剩一条」——这个故障真实发生过。
      - name: Build (Wails)
        working-directory: app
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            bash scripts/build.sh -platform ${{ matrix.platform }} -skipbindings -nsis
          else
            bash scripts/build.sh -platform ${{ matrix.platform }} -skipbindings
          fi
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          v="${{ needs.version.outputs.version }}"
          cd app/build/bin
          # 1. 压成 zip（保留可执行权限，作为自更新与便携包）
          ditto -c -k --sequesterRsrc --keepParent downvid.app \
            "../../../DownVid-Wails-${{ matrix.suffix }}-${v}.zip"
          # 2. 制作 DMG 安装器（带 Applications 快捷方式）
          DMG_TMP="$(mktemp -d)"
          cp -R downvid.app "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          hdiutil create -volname "DownVid" -srcfolder "$DMG_TMP" -ov -format UDZO \
            "../../../DownVid-Wails-${{ matrix.suffix }}-${v}.dmg"
          rm -rf "$DMG_TMP"
          ls -la ../../../DownVid-Wails-*

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          # 1. 便携绿色版 zip
          Compress-Archive -Path app/build/bin/downvid.exe `
            -DestinationPath "DownVid-Wails-windows-x64-$v.zip"
          # 2. 拷贝 NSIS 安装器
          $installer = Get-ChildItem -Path app/build/bin -Filter "*installer.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "DownVid-Wails-windows-x64-$v-installer.exe"
          }
          Get-Item DownVid-Wails-* | Format-List Name, Length

      - name: Package Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          v="${{ needs.version.outputs.version }}"
          cd app/build/bin
          # 1. 便携 tar.gz
          tar -czf "../../../DownVid-Wails-${{ matrix.suffix }}-${v}.tar.gz" downvid
          
          # 2. 制作 DEB 安装包
          cd ../../..
          DEB_DIR="deb-pkg/downvid_${v}_amd64"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$DEB_DIR/DEBIAN"
          
          cp app/build/bin/downvid "$DEB_DIR/usr/bin/downvid"
          chmod 755 "$DEB_DIR/usr/bin/downvid"
          cp app/build/appicon.png "$DEB_DIR/usr/share/icons/hicolor/512x512/apps/downvid.png"
          
          # 用 printf 而不是 heredoc：heredoc 正文不能缩进，一旦顶格写进 YAML
          # 块标量就提前结束，整个工作流会被 GitHub 判为非法文件（每次 push 0 秒失败）
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=DownVid' \
            'Comment=Desktop Video Downloader' \
            'Exec=/usr/bin/downvid' \
            'Icon=downvid' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=AudioVideo;Network;Utility;' \
            > "$DEB_DIR/usr/share/applications/downvid.desktop"
          chmod 644 "$DEB_DIR/usr/share/applications/downvid.desktop"

          printf '%s\n' \
            'Package: downvid' \
            "Version: ${v}" \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: DownVid <xynrin@icloud.com>' \
            'Description: DownVid open-source desktop video downloader.' \
            > "$DEB_DIR/DEBIAN/control"
          chmod 644 "$DEB_DIR/DEBIAN/control"

          dpkg-deb --build "$DEB_DIR" "DownVid-Wails-${{ matrix.suffix }}-${v}.deb"
          rm -rf deb-pkg
          ls -la DownVid-Wails-*

      - uses: actions/upload-artifact@v7
        with:
          name: wails-${{ matrix.suffix }}
          path: |
            DownVid-Wails-*.zip
            DownVid-Wails-*.tar.gz
            DownVid-Wails-*.dmg
            DownVid-Wails-*.exe
            DownVid-Wails-*.deb
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [version, build-wails]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.version.outputs.version != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 正文顶部生成「点徽章即下载」的引导区：Release 里 CHANGELOG 内容较长，
      # 此前不少用户拉到页面后不知道点哪里下载。下载链接按实际产物生成，
      # 不会出现指向不存在文件的死链。
      - name: Generate release notes
        id: changelog
        run: |
          node scripts/gen-release-notes.mjs artifacts "$VERSION" CHANGELOG.md > /tmp/release-notes.md
          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat /tmp/release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # 手动发布时 tag 尚不存在，由 action 在当前提交上创建
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          # 预发布（测试版）：稳定用户的自动更新不会拿到它。
          # 由 workflow_dispatch 的 prerelease 输入决定；打 tag 触发时为 false。
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            artifacts/DownVid-Wails-*.zip
            artifacts/DownVid-Wails-*.tar.gz
            artifacts/DownVid-Wails-*.dmg
            artifacts/DownVid-Wails-*.exe
            artifacts/DownVid-Wails-*.deb

      # 发布**完成后**回头核对一次：Release 真的存在、且三个平台的包都齐。
      # 为什么需要这一步：实测 `v1.3.5` 的 tag 推上去了、CHANGELOG 也写了，
      # 但这次运行在 3 分钟后**被取消**，于是 GitHub Release 里没有 v1.3.5，
      # 更新通道仍指向 v1.3.4 —— 所有存量用户永远收不到这次修复，
      # 而版本号已经继续往前走了。这种失败**没有任何提示**：
      # tag 在、CHANGELOG 在、package.json 也在，只有 Release 页面少了一条。
      #
      # 放在最后而不是依赖 job 的成功状态：被取消时后续步骤不执行，
      # 恰恰是我们希望有人（或下一个版本的发布）注意到的时刻。
      - name: 校验发布完整性
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release.mjs --tag "v${{ env.VERSION }}"

      # ===== 官网版本号：只在确认发布成功之后才刷 =====
      #
      # 官网是无构建的静态站，页面上的版本号只能是硬编码的：脚本拉到 releases/latest
      # 会覆盖成真实 tag，但离线 / 被限流 / 禁用 sessionStorage 时会退回那个写死的值。
      # 不刷新它不会报错，只会安静地过期——页面上写着 v1.3.4 而实际最新版是 v1.4.0。
      #
      # 顺序很关键：**发布失败时官网不该先跳到一个不存在的版本**。放在自检之后，
      # 写入的版本一定已经在 Releases 里（自检失败时这一步不会执行）。
      # 预发布也跳过：latest 通道拿不到 beta，官网显示 beta 号会误导稳定用户。
      - name: 刷新官网版本号
        if: needs.version.outputs.prerelease != 'true'
        run: |
          node scripts/sync-website-version.mjs "$VERSION"
          node scripts/lint-website.mjs

      - name: 提交回 main
        if: needs.version.outputs.prerelease != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # checkout 默认停在 tag 对应的游离 HEAD 上。这里显式挪到 origin/main 顶端再写，
          # 而不是 `git push HEAD:main`：打 tag 之后 main 若又往前走了（比如这条提交本身、
          # 或别人的 PR），直接推会被拒，官网版本号就静默停在上一个版本。
          git fetch origin main
          git checkout -B main origin/main
          # 重新写一次：origin/main 上的 index.html 可能是旧版本
          node scripts/sync-website-version.mjs "$VERSION"
          git add website/index.html
          if git diff --cached --quiet; then
            echo "官网版本号已是最新，无需提交"
            exit 0
          fi
          git commit -m "chore(website): 发布后同步官网版本号至 v$VERSION" -m "由 release.yml 在 Release 创建成功后自动写入，离线兜底值不再是过期的。"
          git push origin main

      # ===== 显式触发官网部署：不指望「Git 集成恰好收到了这次 push」 =====
      #
      # 官网本来只靠 Vercel 的 Git 集成：推 main 就部署。但上面那次提交是用
      # GITHUB_TOKEN 推的——GitHub 不会为它新建 Actions run（防递归），而 Vercel 那边
      # 到底有没有部署、部署的是哪个提交，在 GitHub 里**看不到任何信号**。
      # 一次静默失败的后果是：Release 已经发出去，官网的离线兜底版本号却停在上一版。
      #
      # 所以这里显式调一次 Deploy Hook（Vercel 项目 → Settings → Git → Deploy Hooks，
      # 分支选 main，URL 存成仓库 secret `VERCEL_DEPLOY_HOOK`），再回读线上页面，
      # 确认 `data-version` 真的变成了本次版本。只有「确实部署成功」才算这一步通过。
      #
      # 没配 secret 时只警告、不失败：Git 集成仍是兜底，发布不该因为少一条可选
      # 触发路径而变红；但那条 warning 不代表官网已经更新。
      # 同一个提交重复触发会被 Vercel 自己取消，不会堆积部署。
      - name: 触发官网部署
        if: needs.version.outputs.prerelease != 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::未配置 VERCEL_DEPLOY_HOOK，跳过显式部署；官网仍会由 Vercel 的 Git 集成发布。"
            exit 0
          fi

          # 站点域名只在 shared/app.ts 里维护，这里不要另写一份
          SITE=$(grep -oE "WEBSITE_URL = '[^']+'" shared/app.ts | cut -d"'" -f2)
          if [ -z "$SITE" ]; then
            echo "::error::无法从 shared/app.ts 解析 WEBSITE_URL"
            exit 1
          fi

          echo "触发 Deploy Hook：$SITE"
          CURL_RC=0
          # 状态码与响应体一次取回：不落临时文件，少一个可能写不进去的路径
          RESP=$(curl -sS -X POST -w '\n%{http_code}' "$VERCEL_DEPLOY_HOOK") || CURL_RC=$?
          HTTP=$(printf '%s\n' "$RESP" | tail -n1)
          BODY=$(printf '%s\n' "$RESP" | sed '$d')
          if [ "$CURL_RC" -ne 0 ]; then
            echo "::error::调用 Vercel Deploy Hook 失败（curl exit $CURL_RC）：$BODY"
            exit 1
          fi
          case "$HTTP" in
            2*) ;;
            *)
              echo "::error::Vercel Deploy Hook 返回 HTTP $HTTP：$BODY"
              exit 1
              ;;
          esac
          echo "$BODY"
          if ! printf '%s' "$BODY" | grep -q '"job"'; then
            echo "::error::Deploy Hook 没有返回 job，部署未触发：$BODY"
            exit 1
          fi

          # 部署是异步的：轮询线上页面，直到 data-version 变成本次版本。
          # 静态站通常 30–90 秒；给 5 分钟，超时就是真出问题了（不要静默收工）。
          # 每次带不同的查询串：避免 CDN 把上一次的旧 HTML 缓存住，白等 5 分钟
          for attempt in $(seq 1 30); do
            if curl -fsS "$SITE/?deploy=$VERSION-$attempt" | grep -Eq "data-version[^>]*>v$VERSION<"; then
              echo "官网已更新到 v$VERSION（第 $attempt 次检查）"
              exit 0
            fi
            sleep 10
          done
          echo "::error::5 分钟内线上官网仍未出现 v$VERSION：去 Vercel 面板看这次部署的日志。"
          exit 1
