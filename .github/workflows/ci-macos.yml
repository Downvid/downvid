name: CI · macOS

# macOS 侧回归。
#
# macOS 有三处只有这里能验：
#   1. **未签名的 .app**：本项目没有付费证书，用户首次启动要右键打开或去
#      「隐私与安全性」放行
#   2. **通用二进制**：`darwin/universal` 由 Wails 自己 lipo 合并，边车必须为
#      arm64 与 amd64 各编一份（build.sh 负责），否则下载依赖时找不到二进制
#   3. **quarantine 属性**：网络下载的可执行文件带 com.apple.quarantine，
#      Apple Silicon 会直接 `killed: 9` —— 边车安装后必须 xattr -c + codesign

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # 变更范围：文档/官网/图片-only 的 push 不跑重活（交叉编译、三平台产物、
  # 真实依赖端到端），只保留跑 lint / 单测的 frontend job —— lint:docs 与
  # lint:website 恰好就是校验这些文件的，所以它们不能被跳过。
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- . \
              ':(exclude)docs/**' ':(exclude)**.md' ':(exclude)website/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: 后端 · Go 侧车 + Go 核心（macOS）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: gofmt（侧车 + 核心）
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l backend app)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet（侧车）
        working-directory: backend
        run: go vet ./...

      - name: go test（侧车）
        working-directory: backend
        run: go test -shuffle=on -count=1 ./...

      # main.go 里有 `//go:embed all:frontend/dist`：目录不存在时 vet/测试
      # 直接编译失败（pattern all:frontend/dist: no matching files found）
      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: go vet（核心）
        working-directory: app
        run: go vet ./...

      - name: go test（核心）
        working-directory: app
        run: go test -shuffle=on -count=1 ./...

      # 两个架构都要能编：产物同时出 arm64 与 amd64
      - name: 交叉编译 darwin 双架构
        working-directory: backend
        shell: bash
        run: |
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build -o /dev/null ./cmd/downvid-deps
            echo "  ok darwin/$arch"
          done

  frontend:
    name: 前端 · 类型 / 契约 / 单测（macOS）
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      # `wails generate module` 要跑 Go 编译器
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - run: pnpm install --frozen-lockfile

      - name: 图标名校验
        run: pnpm lint:icons

      - name: 官网校验
        run: pnpm lint:website

      - name: 文档一致性校验（AGENTS.md ↔ CLAUDE.md）
        run: pnpm lint:docs

      - name: 代码来源审计
        run: pnpm audit:provenance

      - name: 署名合规（上游版权声明 ↔ 剩余上游代码）
        run: pnpm lint:attribution

      - name: 架构边界校验
        run: pnpm lint:boundaries

      - name: 仓库坐标一致性
        run: pnpm sync:repo

      - name: 更新日志副本一致
        run: pnpm sync:changelog

      - name: 工具链版本一致
        run: pnpm sync:toolchain

      - name: i18n 词条校验
        run: pnpm lint:i18n:app

      - name: 工作流健全性校验
        run: pnpm lint:workflows

      # app/frontend 是**独立包**（不在根 pnpm workspace 里），要单独装依赖
      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      # wailsjs/ 是**生成**的（wails generate module），不入库。
      # 顺序不能反：generate 要先编译 Go 包，而 main.go 里有
      # `//go:embed all:frontend/dist`，dist 不存在时编译直接失败。
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定（wailsjs）
        working-directory: app
        run: wails generate module

      # `tsc` **不解析 .svelte**，组件与 store 的契约漂移只有它能看见
      - name: 前端类型检查（svelte-check）
        working-directory: app/frontend
        run: pnpm check

      - name: 前端纯逻辑单测
        working-directory: app/frontend
        run: pnpm test

      - name: 根目录纯逻辑单测
        run: pnpm test

  build:
    name: 构建 · 未签名 .app 与边车
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定
        working-directory: app
        run: wails generate module

      - name: 构建（含依赖边车）
        run: bash app/scripts/build.sh -platform darwin/universal

      # 未签名是本项目的既定事实（没有付费证书）。这里确认两个架构都在：
      # 少一个的话，对应芯片的用户装上去会是「已损坏」。
      - name: 产物架构检查
        shell: bash
        run: |
          APP=$(find app/build/bin -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::构建产物里找不到 .app"
            find app/build/bin -maxdepth 2 | head -20
            exit 1
          fi
          echo "检查 $APP"
          lipo -archs "$APP/Contents/MacOS/"*
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/"*)
          for want in arm64 x86_64; do
            case "$ARCHS" in
              *"$want"*) echo "  ok $want" ;;
              *) echo "::error::产物缺少 $want 架构"; exit 1 ;;
            esac
          done
