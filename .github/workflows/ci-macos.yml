name: CI · macOS

# macOS 侧回归。
#
# macOS 有三处只有这里能验：
#   1. **未签名的 .app**：本项目没有付费证书，用户首次启动要右键打开或去
#      「隐私与安全性」放行
#   2. **通用二进制**：`darwin/universal` 由 Wails 自己 lipo 合并，边车必须为
#      arm64 与 amd64 各编一份（build.sh 负责），否则下载依赖时找不到二进制
#   3. **quarantine 属性**：网络下载的可执行文件带 com.apple.quarantine，
#      Apple Silicon 会直接 `killed: 9` —— 边车安装后必须 xattr -c + codesign

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # 变更范围：文档/官网/图片-only 的 push 不跑重活（交叉编译、三平台产物、
  # 真实依赖端到端）。前端静态检查已从 CI 移除，需要时在本地运行
  # `pnpm lint:*` / `pnpm --dir app/frontend check`。
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- . \
              ':(exclude)docs/**' ':(exclude)**.md' ':(exclude)website/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: 后端 · Go 侧车 + Go 核心（macOS）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: gofmt（侧车 + 核心）
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l backend app)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet（侧车）
        working-directory: backend
        run: go vet ./...

      - name: go test（侧车）
        working-directory: backend
        run: go test -shuffle=on -count=1 ./...

      # main.go 里有 `//go:embed all:frontend/dist`：目录不存在时 vet/测试
      # 直接编译失败（pattern all:frontend/dist: no matching files found）
      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: go vet（核心）
        working-directory: app
        run: go vet ./...

      - name: go test（核心）
        working-directory: app
        run: go test -shuffle=on -count=1 ./...

      # 两个架构都要能编：产物同时出 arm64 与 amd64
      - name: 交叉编译 darwin 双架构
        working-directory: backend
        shell: bash
        run: |
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build -o /dev/null ./cmd/downvid-deps
            echo "  ok darwin/$arch"
          done

  build:
    name: 构建 · 未签名 .app 与边车
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定
        working-directory: app
        run: wails generate module

      - name: 构建（含依赖边车）
        run: bash app/scripts/build.sh -platform darwin/universal

      # 未签名是本项目的既定事实（没有付费证书）。这里确认两个架构都在：
      # 少一个的话，对应芯片的用户装上去会是「已损坏」。
      - name: 产物架构检查
        shell: bash
        run: |
          APP=$(find app/build/bin -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::构建产物里找不到 .app"
            find app/build/bin -maxdepth 2 | head -20
            exit 1
          fi
          echo "检查 $APP"
          lipo -archs "$APP/Contents/MacOS/"*
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/"*)
          for want in arm64 x86_64; do
            case "$ARCHS" in
              *"$want"*) echo "  ok $want" ;;
              *) echo "::error::产物缺少 $want 架构"; exit 1 ;;
            esac
          done
