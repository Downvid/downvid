name: CI · Windows

# Windows 侧回归。
#
# Windows runner 默认 shell 是 PowerShell：`/tmp` 会解析成 `D:\tmp`、
# `test -s` 等 POSIX 断言不成立。需要 POSIX 语义的步骤一律显式写 `shell: bash`
# （runner 自带 Git Bash）。
#
# 另外这里的 gofmt 检查还兼职一个容易静默失配的坑：Windows 默认
# `core.autocrlf=true`，检出即 CRLF，而 CRLF 不是 gofmt 的输出。
# 仓库根部的 `.gitattributes`（`* text=auto eol=lf`）统一为 LF，别删。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # 变更范围：文档/官网/图片-only 的 push 不跑重活（交叉编译、三平台产物、
  # 真实依赖端到端），只保留跑 lint / 单测的 frontend job —— lint:docs 与
  # lint:website 恰好就是校验这些文件的，所以它们不能被跳过。
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- . \
              ':(exclude)docs/**' ':(exclude)**.md' ':(exclude)website/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: 后端 · Go 侧车 + Go 核心（Windows）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: gofmt（侧车 + 核心）
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l backend app)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet（侧车）
        working-directory: backend
        run: go vet ./...

      - name: go test（侧车）
        working-directory: backend
        run: go test -shuffle=on -count=1 ./...

      # main.go 里有 `//go:embed all:frontend/dist`：目录不存在时 vet/测试
      # 直接编译失败（pattern all:frontend/dist: no matching files found）
      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: go vet（核心）
        working-directory: app
        run: go vet ./...

      # Windows 是唯一会遇到「POSIX 专用代码编译不过」的平台：
      # 进程树终止、路径归一、信号语义都分平台实现，只有这里能编出来。
      - name: go test（核心）
        working-directory: app
        run: go test -shuffle=on -count=1 ./...

      - name: 交叉编译 windows 边车
        working-directory: backend
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/downvid-deps
          echo "  ok windows/amd64"

  frontend:
    name: 前端 · 类型 / 契约 / 单测（Windows）
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      # `wails generate module` 要跑 Go 编译器
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - run: pnpm install --frozen-lockfile

      - name: 图标名校验
        run: pnpm lint:icons

      - name: 官网校验
        run: pnpm lint:website

      - name: 文档一致性校验（AGENTS.md ↔ CLAUDE.md）
        run: pnpm lint:docs

      - name: 代码来源审计
        run: pnpm audit:provenance

      - name: 署名合规（上游版权声明 ↔ 剩余上游代码）
        run: pnpm lint:attribution

      - name: 架构边界校验
        run: pnpm lint:boundaries

      - name: 仓库坐标一致性
        run: pnpm sync:repo

      - name: 更新日志副本一致
        run: pnpm sync:changelog

      - name: 工具链版本一致
        run: pnpm sync:toolchain

      - name: i18n 词条校验
        run: pnpm lint:i18n:app

      - name: 工作流健全性校验
        run: pnpm lint:workflows

      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 准备 embed 目录
        shell: bash
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定（wailsjs）
        working-directory: app
        run: wails generate module

      - name: 前端类型检查（svelte-check）
        working-directory: app/frontend
        run: pnpm check

      - name: 前端纯逻辑单测
        working-directory: app/frontend
        run: pnpm test

      - name: 根目录纯逻辑单测
        run: pnpm test

  build:
    name: 构建 · Windows 单文件 exe
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: 准备 embed 目录
        shell: bash
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定
        working-directory: app
        run: wails generate module

      # build.sh 是 bash 脚本（依赖 Microsoft 的 webview2 由 Wails 自带处理）
      - name: 构建（含依赖边车）
        shell: bash
        run: bash app/scripts/build.sh -platform windows/amd64

      - name: 产物自检
        shell: bash
        run: |
          BIN=$(find app/build/bin -maxdepth 2 -type f -name '*.exe' | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::构建产物里找不到 exe"
            find app/build/bin -maxdepth 2 | head -20
            exit 1
          fi
          echo "产物：$BIN"
          ls -lh "$BIN"
          SIZE=$(wc -c < "$BIN")
          if [ "$SIZE" -lt 8000000 ]; then
            echo "::error::产物只有 $SIZE 字节，前端或边车很可能没嵌进去"
            exit 1
          fi
