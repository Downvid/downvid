name: CI · Windows

# Windows 侧的完整回归。
#
# Windows 是**问题最多、也最难在本地发现**的平台，本地是 macOS 不代表这里能过。
# 历史上 CI 的 windows job 抓到过三类本地/ubuntu 都发现不了的问题：
#   1. `process.platform` 是 win32 而 GOOS 是 windows，直接透传会
#      `unsupported GOOS/GOARCH pair win32/amd64`（macOS/Linux 恰好同名所以看不出来）
#   2. 默认 shell 是 PowerShell：`/tmp` 会解析成 `D:\tmp`，POSIX 断言不成立
#      → 需要 POSIX 语义的步骤显式写 `shell: bash`
#   3. 换行符：默认 core.autocrlf=true，检出即 CRLF，而 CRLF 不是 gofmt 的输出
#      → 靠仓库根的 .gitattributes 统一为 LF，这里再独立校验一次
#
# 因此这个工作流刻意**不复用** Linux 的步骤：同样的检查在 Windows 上要按
# Windows 的语义再跑一遍，能重复的只是「跑什么」，不是「怎么跑」。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  backend:
    name: 后端 · Go 侧车（Windows）
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      # .gitattributes 必须把换行符统一成 LF，否则 gofmt 会把每个 Go 文件
      # 都判为未格式化（CRLF 不是 gofmt 的输出）
      - name: 检出文件必须是 LF（.gitattributes 生效）
        shell: bash
        run: |
          if git ls-files --eol backend | grep -q 'w/crlf'; then
            echo "::error::backend 下的 Go 文件是 CRLF，检查 .gitattributes（* text=auto eol=lf）"
            git ls-files --eol backend | grep 'w/crlf'
            exit 1
          fi
          echo "换行符 ok"

      - name: gofmt（格式）
        working-directory: backend
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet（静态检查）
        working-directory: backend
        run: go vet ./...

      - name: go test（打乱顺序）
        working-directory: backend
        run: go test -shuffle=on -count=1 ./...

      # 必须能编出 Windows 原生 exe，后续的原生回归要用它
      - name: 编译 Windows 边车
        working-directory: backend
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/downvid-deps
          echo "  ok windows/amd64"

  # ===== 原生 exe 集成回归：本工作流的核心价值 =====
  native-runtime:
    name: 集成 · 原生 exe 运行依赖回归
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      # 探测、损坏副本、WinGet/Scoop 落点、慢候选、总时限、进程树清理…
      # 这些只能在 Windows 上真跑：脚本会编译一个可控的原生 fixture
      # （scripts/fixtures/runtime-tool.go）来模拟慢启动与损坏文件
      - name: 原生运行依赖回归
        run: pnpm test:runtime:windows

  frontend:
    name: 前端 · 类型 / 契约 / 单测（Windows）
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      # 路径断言是这里的重点：测试里写死 `/tmp/out/...` 会在 Windows 上失败，
      # 生产代码用 path.join 得到的是反斜杠，预期值也必须用 path.join 算
      - name: 类型检查
        run: pnpm vue-tsc --noEmit

      - name: IPC 契约校验
        run: pnpm lint:ipc

      - name: 图标名校验
        run: pnpm lint:icons

      - name: 官网校验
        run: pnpm lint:website

      - name: 文档一致性校验（AGENTS.md ↔ CLAUDE.md）
        run: pnpm lint:docs

      # 来源审计：哪些代码来自上游 Videdown、占比多少，由脚本从仓库内快照现场重算。
      # 新增了上游衍生文件却没登记 / 登记的数字已过期 → 直接红叉（见 docs/provenance/audit.md）
      - name: 代码来源审计
        run: pnpm audit:provenance

      # MIT 要求「substantial portions」附带版权声明。上游代码未归零前删掉声明
      # 会让许可证失效，而删一行 LICENSE 不会让任何测试变红——所以单独拦。
      - name: 署名合规（上游版权声明 ↔ 剩余上游代码）
        run: pnpm lint:attribution

      # 架构边界：core/ 不得 import electron、前端不得直接用主进程实现等七条规则。
      # 违反时类型检查与单测都不会红，只在容器/前端运行时静默失效（见 docs/provenance/architecture.md §3.2）
      - name: 架构边界校验
        run: pnpm lint:boundaries

      # 仓库坐标散落 20+ 处，漏改任一处 = 存量用户收不到更新（唯一一类「发新版也修不好」的故障）
      - name: 仓库坐标一致性
        run: pnpm sync:repo

      # 文档里的「当前值类」数字（词条数 / 用例数 / settings 字段 / 事件清单）与代码实测一致
      - name: 文档数字同步
        run: pnpm sync:doc-numbers

      # Go/Node/pnpm 版本散落 20+ 处，漏改只会让 CI 静默用旧版本编译
      - name: 工具链版本一致
        run: pnpm sync:toolchain

      # 词条漏英文 / 占位符对不上都不会报错，只会静默显示错文案
      - name: i18n 词条校验
        run: pnpm lint:i18n

      # 工作流的错误本地跑什么都发现不了，只能等 CI 变红。
      # 这条静态校验把「用了某工具但没装」变成提交前就能看到的问题。
      - name: 工作流健全性校验
        run: pnpm lint:workflows

      # 镜像里的问题几乎都是不报错的那种（依赖版本漂移 / 退回 tsx / 更新检查退化），
      # 读文件就能判定。三平台都查一遍，与其它 lint 保持一致。
      - name: 容器镜像定义校验
        run: pnpm lint:docker

      # 新前端（app/frontend，Svelte 5）：`tsc` **不解析 .svelte**，
      # 于是组件与 store 的契约漂移长期无人发现——累计 48 个真错误，
      # 其中「设置页每个按钮都失效」就是这么漏出去的。
      - name: 前端依赖安装（app/frontend 是独立包，不在根 workspace）
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查（svelte-check）
        working-directory: app/frontend
        run: pnpm check

      # 新前端的词条表是**独立的一份**（app/frontend/src/lib/i18n.svelte.ts）。
      # 中英不成对时只会静默显示错语言，必须静态查。
      - name: 前端词条校验（app）
        run: pnpm lint:i18n:app


      - name: 纯逻辑单测（Vitest）
        run: pnpm test

      - name: 更新流程回归
        run: pnpm test:updater

      - name: 设置迁移与向后兼容
        run: pnpm test:settings:migration

  integration:
    name: 集成 · 下载 / 加速（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      # 下载链路里有大量路径与文件锁语义，Windows 与 Unix 差异很大
      # （重命名被占用、临时文件清理、长路径）
      - name: 下载集成回归
        run: pnpm test:download:integration

      - name: 加速基准
        run: pnpm test:acceleration

      - name: 解析集成回归
        run: pnpm test:parse:integration

  package:
    name: 打包 · 产物内容校验（Windows）
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - name: 构建前端与主进程
        run: pnpm vite build

      - name: 打包到目录
        run: pnpm exec electron-builder --win dir --publish never --config electron-builder.json5

      # Windows 侧要特别确认：边车是 .exe、没有误带 yt-dlp.exe/ffmpeg.exe
      - name: 产物内容校验
        run: pnpm test:package
