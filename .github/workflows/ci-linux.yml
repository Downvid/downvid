name: CI · Linux

# Linux 侧的完整回归。
#
# Linux 有三处只有这里能验：
#   1. **webkit2gtk 4.0 构建**：Wails v2.16 的 cgo 指令默认找 4.0，只装 4.1
#      会以「Package webkit2gtk-4.0 was not found」失败（曾经踩过）
#   2. **交叉编译全部 5 个目标**：GNU/Linux 的 runner 编译 macOS / Windows 边车不需要
#      额外工具链，是唯一能一次编全的平台
#   3. **真实 yt-dlp / ffmpeg 端到端**：本机装了就用真的跑，没装则明确跳过

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # 变更范围：文档/官网/图片-only 的 push 不跑重活（交叉编译、三平台产物、
  # 真实依赖端到端）。前端静态检查已从 CI 移除，需要时在本地运行
  # `pnpm lint:*` / `pnpm --dir app/frontend check`。
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- . \
              ':(exclude)docs/**' ':(exclude)**.md' ':(exclude)website/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: 后端 · Go 侧车 + Go 核心
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: gofmt（侧车 + 核心）
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l backend app)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet（侧车）
        working-directory: backend
        run: go vet ./...

      - name: go test（侧车）
        working-directory: backend
        run: go test -shuffle=on -count=1 ./...

      # main.go 里有 `//go:embed all:frontend/dist`：目录不存在时 vet/测试
      # 直接编译失败（pattern all:frontend/dist: no matching files found）
      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: go vet（核心）
        working-directory: app
        run: go vet ./...

      - name: go test（核心）
        working-directory: app
        run: go test -shuffle=on -count=1 ./...

      # 边车必须能编出全部 5 个平台：任一编不过，对应平台的用户就装不上
      - name: 交叉编译全部平台
        working-directory: backend
        shell: bash
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/downvid-deps
            echo "  ok ${target}"
          done

  integration:
    name: 集成 · 真实 yt-dlp / ffmpeg
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/test-e2e-real.mjs

  build:
    name: 构建 · Wails 单文件产物
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # 必须用 22.04：24.04 的软件源里只剩 webkit2gtk-4.1，而 Wails v2.16
    # 默认找 4.0（要加 `-tags webkit2_41` 才用 4.1），装不上就直接 exit 100。
    # release.yml 的构建矩阵同样固定在 22.04。
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      # Linux 构建 Wails 需要 cgo 链接 GTK / WebKit。
      # Wails v2.16 默认找 webkit2gtk-4.0（加 `-tags webkit2_41` 才用 4.1），
      # 只装 4.1 会以「Package webkit2gtk-4.0 was not found」失败。
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定
        working-directory: app
        run: wails generate module

      - name: 构建（含依赖边车）
        run: bash app/scripts/build.sh

      - name: 产物自检
        shell: bash
        run: |
          BIN=$(find app/build/bin -maxdepth 2 -type f -name downvid | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::构建产物里找不到 downvid 可执行文件"
            find app/build/bin -maxdepth 2 | head -20
            exit 1
          fi
          echo "产物：$BIN"
          ls -lh "$BIN"
          # 单文件产物把前端与边车都嵌进去了，正常在 15 MB 以上；
          # 明显偏小说明 embed 没生效（构建能过，运行时才是白页 / 依赖页空）
          SIZE=$(wc -c < "$BIN")
          if [ "$SIZE" -lt 8000000 ]; then
            echo "::error::产物只有 $SIZE 字节，前端或边车很可能没嵌进去"
            exit 1
          fi
