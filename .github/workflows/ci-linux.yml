name: CI · Linux

# Linux 侧的完整回归。
#
# Linux 有三处只有这里能验：
#   1. **webkit2gtk 4.0 构建**：Wails v2.16 的 cgo 指令默认找 4.0，只装 4.1
#      会以「Package webkit2gtk-4.0 was not found」失败（曾经踩过）
#   2. **交叉编译全部 5 个目标**：GNU/Linux 的 runner 编译 macOS / Windows 边车不需要
#      额外工具链，是唯一能一次编全的平台
#   3. **真实 yt-dlp / ffmpeg 端到端**：本机装了就用真的跑，没装则明确跳过

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  backend:
    name: 后端 · Go 侧车 + Go 核心
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: gofmt（侧车 + 核心）
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l backend app)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet（侧车）
        working-directory: backend
        run: go vet ./...

      - name: go test（侧车）
        working-directory: backend
        run: go test -shuffle=on -count=1 ./...

      - name: go vet（核心）
        working-directory: app
        run: go vet ./...

      - name: go test（核心）
        working-directory: app
        run: go test -shuffle=on -count=1 ./...

      # 边车必须能编出全部 5 个平台：任一编不过，对应平台的用户就装不上
      - name: 交叉编译全部平台
        working-directory: backend
        shell: bash
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/downvid-deps
            echo "  ok ${target}"
          done

  frontend:
    name: 前端 · 类型 / 契约 / 单测
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      # `wails generate module` 要跑 Go 编译器
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - run: pnpm install --frozen-lockfile

      - name: 图标名校验
        run: pnpm lint:icons

      - name: 官网校验
        run: pnpm lint:website

      - name: 文档一致性校验（AGENTS.md ↔ CLAUDE.md）
        run: pnpm lint:docs

      # 来源审计：哪些代码来自上游 Videdown、占比多少，由脚本从仓库内快照现场重算。
      # 新增了上游衍生文件却没登记 / 登记的数字已过期 → 直接红叉
      - name: 代码来源审计
        run: pnpm audit:provenance

      # MIT 要求「substantial portions」附带版权声明。上游代码未归零前删掉声明
      # 会让许可证失效，而删一行 LICENSE 不会让任何测试变红——所以单独拦。
      - name: 署名合规（上游版权声明 ↔ 剩余上游代码）
        run: pnpm lint:attribution

      # 架构边界：app/internal 的包之间不得互相 import、不得依赖 cmd。
      # 违反时编译与单测都不会红，只会让包拆不开。
      - name: 架构边界校验
        run: pnpm lint:boundaries

      # 仓库坐标散落 20+ 处，漏改任一处 = 用户收不到更新
      - name: 仓库坐标一致性
        run: pnpm sync:repo

      # 应用里的「更新日志」读的是 app/internal/changelog/ 下的**副本**
      # （`//go:embed` 不能引用包目录之外的文件）。副本会静默过期。
      - name: 更新日志副本一致
        run: pnpm sync:changelog

      # Go/Node/pnpm 版本散落 20+ 处，漏改只会让 CI 静默用旧版本编译
      - name: 工具链版本一致
        run: pnpm sync:toolchain

      # 词条漏英文 / 占位符对不上都不会报错，只会静默显示错文案
      - name: i18n 词条校验
        run: pnpm lint:i18n:app

      # 工作流的错误本地跑什么都发现不了，只能等 CI 变红。
      - name: 工作流健全性校验
        run: pnpm lint:workflows

      # app/frontend 是**独立包**（不在根 pnpm workspace 里），要单独装依赖
      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      # wailsjs/ 是**生成**的（wails generate module），不入库。
      # 不生成就直接 svelte-check，会报三条 "Cannot find module
      # '../../wailsjs/go/main/App'"——那是 CI 缺步骤，不是代码错。
      #
      # 注意顺序：`wails generate module` 会先把 Go 包编译一遍，
      # 而 main.go 里有 `//go:embed all:frontend/dist`——dist 不存在时
      # 直接报 `pattern all:frontend/dist: no matching files found`。
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定（wailsjs）
        working-directory: app
        run: wails generate module

      # `tsc` **不解析 .svelte**，组件与 store 的契约漂移只有它能看见
      - name: 前端类型检查（svelte-check）
        working-directory: app/frontend
        run: pnpm check

      - name: 前端纯逻辑单测
        working-directory: app/frontend
        run: pnpm test

      # shared/ 与发布脚本的纯逻辑
      - name: 根目录纯逻辑单测
        run: pnpm test

  integration:
    name: 集成 · 真实 yt-dlp / ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/test-e2e-real.mjs

  build:
    name: 构建 · Wails 单文件产物
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      # Linux 构建 Wails 需要 cgo 链接 GTK / WebKit。
      # Wails v2.16 默认找 webkit2gtk-4.0（加 `-tags webkit2_41` 才用 4.1），
      # 只装 4.1 会以「Package webkit2gtk-4.0 was not found」失败。
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 前端依赖安装
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: 准备 embed 目录
        run: bash app/scripts/prepare-embed-dir.sh

      - name: 生成 Wails 绑定
        working-directory: app
        run: wails generate module

      - name: 构建（含依赖边车）
        run: bash app/scripts/build.sh

      - name: 产物自检
        shell: bash
        run: |
          BIN=$(find app/build/bin -maxdepth 2 -type f -name downvid | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::构建产物里找不到 downvid 可执行文件"
            find app/build/bin -maxdepth 2 | head -20
            exit 1
          fi
          echo "产物：$BIN"
          ls -lh "$BIN"
          # 单文件产物把前端与边车都嵌进去了，正常在 15 MB 以上；
          # 明显偏小说明 embed 没生效（构建能过，运行时才是白页 / 依赖页空）
          SIZE=$(wc -c < "$BIN")
          if [ "$SIZE" -lt 8000000 ]; then
            echo "::error::产物只有 $SIZE 字节，前端或边车很可能没嵌进去"
            exit 1
          fi
