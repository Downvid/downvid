name: CI · Linux

# Linux 侧的完整回归。
#
# 为什么按平台拆成三个工作流（而不是一个带 matrix 的大工作流）：
#   1. 失败定位：日志里一眼看出是哪个平台哪一步，而不是「6 个 job 里有一个红」
#   2. 触发与耗时：Windows/macOS runner 排队慢，Linux 能先给出结论
#   3. 平台专属步骤不必写 `if: runner.os == ...`，可读性差且容易写错
#
# 约定：**新增测试脚本必须挂进对应平台的工作流**。曾经 test:acceleration
# 加了脚本却没接进 CI，加速逻辑长期没有自动化验证。
#
# 每一步都单独命名，脚本内部再用 harness 打印逐用例结果 —— 失败时先看步骤名，
# 再看脚本输出的用例名，不用翻 YAML。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Go 侧车只用标准库，没有 go.sum；关掉缓存省一次网络往返
  GOTOOLCHAIN: local

jobs:
  # ===== Go 侧车 =====
  backend:
    name: 后端 · Go 侧车
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: gofmt（格式）
        working-directory: backend
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet（静态检查）
        working-directory: backend
        run: go vet ./...

      # -shuffle=on 打乱用例顺序，能抓出「用例之间共享包级可变状态」的泄漏。
      # 这类问题单跑必过、全量跑才随机失败（已真实发生过：扫描预算的全局变量）。
      - name: go test（打乱顺序）
        working-directory: backend
        run: go test -shuffle=on -count=1 ./...

      # 边车会被交叉编译成 5 个平台的二进制打进安装包，任一平台编不过都是发布事故
      - name: 交叉编译全部平台
        working-directory: backend
        shell: bash
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/downvid-deps
            echo "  ok ${target}"
          done

  # ===== 前端：类型、契约、纯逻辑单测 =====
  frontend:
    name: 前端 · 类型 / 契约 / 单测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      - name: 类型检查（strict + noUnusedLocals）
        run: pnpm vue-tsc --noEmit

      # IPC 三处（主进程 / preload / env.d.ts）是手工同步的，漏改会静默失败
      - name: IPC 契约校验
        run: pnpm lint:ipc

      # 图标名写错时字体会静默渲染成文字或空白，界面上很难发现
      - name: 图标名校验
        run: pnpm lint:icons

      # 官网是单文件、直接由 Vercel 从 main 发布，中间没有构建步骤：
      # 引错图、漏翻译、配色漂移都只会在线上静默出现
      - name: 官网校验
        run: pnpm lint:website

      - name: 文档一致性校验（AGENTS.md ↔ CLAUDE.md）
        run: pnpm lint:docs

      # 来源审计：哪些代码来自上游 Videdown、占比多少，由脚本从仓库内快照现场重算。
      # 新增了上游衍生文件却没登记 / 登记的数字已过期 → 直接红叉（见 docs/provenance/audit.md）
      - name: 代码来源审计
        run: pnpm audit:provenance

      # 词条漏英文 / 占位符对不上都不会报错，只会静默显示错文案
      - name: i18n 词条校验
        run: pnpm lint:i18n

      # 工作流的错误本地跑什么都发现不了，只能等 CI 变红。
      # 这条静态校验把「用了某工具但没装」变成提交前就能看到的问题。
      - name: 工作流健全性校验
        run: pnpm lint:workflows

      # 镜像里的问题几乎都是**不报错**的那种：依赖版本与清单漂移、退回 tsx、
      # 更新检查退化。这些读文件就能判定，不必等一次几分钟的镜像构建。
      - name: 容器镜像定义校验
        run: pnpm lint:docker

      - name: 纯逻辑单测（Vitest）
        run: pnpm test

  # ===== 主进程侧逻辑（不需要真实 Electron）=====
  main-process:
    name: 主进程 · 更新 / 设置 / 清单
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      # 更新是用户拿到修复的唯一通道，也是唯一「坏了就再也修不好」的功能：
      # 存量用户装的是旧版客户端，没有第二次机会。
      - name: 更新流程回归（版本比较 / 缓存 / 兜底 / 各安装方式分支）
        run: pnpm test:updater

      # 设置形状改动会让老用户设置静默失效；合并写入写错会抹掉别的字段
      - name: 设置迁移与向后兼容
        run: pnpm test:settings:migration

      # Issue 自动关闭的分类逻辑：误关一条真实报告比留一条噪音更糟，
      # 用例全部取自仓库里真实出现过的 Issue 正文（#50 #52 #57 #58）
      - name: Issue 分类回归
        run: pnpm test:issue:triage

      # 依赖清单落后或哈希失配会在用户端变成「下载即校验失败」
      - name: 依赖清单与上游一致
        run: pnpm deps:manifest:check

      # WebUI 服务端（容器版唯一的对外形态）。用的是打包后的产物，
      # 与镜像里跑的是同一份文件 —— 源码能跑不等于打包能跑。
      - name: Web 服务集成回归
        run: pnpm test:web

  # ===== 集成回归：起真实进程、真实文件 IO =====
  integration:
    name: 集成 · 下载 / 加速
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      # 下载链路：本地 HTTP 服务 + 真实文件 IO + 真实 Store，仅在边界替换 Electron API
      - name: 下载集成回归
        run: pnpm test:download:integration

      # 加速基准：并发队列、限速场景、可选 aria2。
      # 未提供外部工具路径时只跑内置基准，外部引擎会被明确跳过。
      - name: 加速基准
        run: pnpm test:acceleration

      # 解析链路（抖音/快手解析器与 yt-dlp 回退），只在本地服务上跑
      - name: 解析集成回归
        run: pnpm test:parse:integration

  # ===== 构建与打包 =====
  package:
    name: 打包 · 产物内容校验
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - run: pnpm install --frozen-lockfile

      - name: 构建前端与主进程
        run: pnpm vite build

      # 校验 electron-builder 配置并打包到目录（不生成安装包），
      # 配置与新版 schema 不兼容时在 PR 阶段即可发现
      - name: 打包到目录
        run: pnpm exec electron-builder --linux dir --publish never --config electron-builder.json5

      # 逐项核对真实产物：边车在不在、有没有误带 yt-dlp/ffmpeg、
      # app.asar 是否完整、package-type 是否存在（决定 deb/rpm 能否自动更新）
      - name: 产物内容校验
        run: pnpm test:package

      # 清单生成脚本自检：用假产物确认不会生成死链
      - name: 更新清单生成脚本自检
        shell: bash
        run: |
          mkdir -p tmp-artifacts
          for f in DownVid-Setup-0.0.0.exe DownVid-arm64-Mac-0.0.0.zip DownVid-x64-Mac-0.0.0.zip DownVid-x86_64-Linux-0.0.0.AppImage DownVid-amd64-Linux-0.0.0.deb DownVid-arm64-Linux-0.0.0.AppImage; do
            echo "$f" > "tmp-artifacts/$f"
          done
          node scripts/gen-update-manifests.mjs tmp-artifacts 0.0.0
          grep -q "DownVid-amd64-Linux-0.0.0.deb" tmp-artifacts/latest-linux.yml
          grep -q "DownVid-x64-Mac-0.0.0.zip" tmp-artifacts/latest-mac.yml

      - name: Release 正文生成脚本自检
        shell: bash
        run: |
          mkdir -p tmp-release && rm -f tmp-release/*
          for f in DownVid-Setup-0.0.0.exe DownVid-arm64-Mac-0.0.0.dmg; do
            echo x > "tmp-release/$f"
          done
          node scripts/gen-release-notes.mjs tmp-release 0.0.0 CHANGELOG.md > /tmp/notes.md
          grep -q "DownVid-Setup-0.0.0.exe" /tmp/notes.md
          grep -q "更新内容" /tmp/notes.md
          if grep -q "DownVid-Portable-0.0.0.exe" /tmp/notes.md; then
            echo "::error::Release 正文引用了不存在的产物（便携版）"
            exit 1
          fi
