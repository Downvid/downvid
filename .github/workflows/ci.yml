name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # 运行依赖（yt-dlp / ffmpeg）不再入库，改为运行时探测与下载，
      # 因此 CI 只需构建 Go 边车，不再拉取任何二进制
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # 侧车只用标准库，没有 go.sum，无需缓存依赖
          cache: false
      - name: Check Go backend
        working-directory: backend
        shell: bash
        run: |
          # 显式指定 bash：默认 shell 在 Windows 上是 PowerShell，
          # 上面用到的 test ! -s 与 /tmp 路径都不成立
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::以下文件未经过 gofmt 格式化："
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...
          go test ./...
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm vue-tsc --noEmit
      # 依赖清单必须与上游一致：版本落后或哈希对不上会在用户端变成"下载即校验失败"
      - name: Check dependency manifest
        if: runner.os == 'Linux'
        run: pnpm deps:manifest:check
      - name: Build
        run: pnpm vite build
      # 校验 electron-builder 配置并打包到目录（不生成安装包），配置与新版 schema 不兼容时在 PR 阶段即可发现
      - name: Package (dir)
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder --linux dir --publish never --config electron-builder.json5
      # 打包产物必须带上依赖边车，否则用户机上依赖检测与下载会整体失效
      - name: Verify sidecar bundled
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x release/*/linux-unpacked/resources/downvid-deps/downvid-deps
      # 安装包里不应再出现 yt-dlp / ffmpeg（体积与授权都靠这条约束守住）
      - name: Verify no bundled binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if find release/*/linux-unpacked/resources -name 'yt-dlp*' -o -name 'ffmpeg*' | grep -q .; then
            echo "::error::安装包中仍包含 yt-dlp/ffmpeg 二进制"
            exit 1
          fi
      - name: Update manifest script
        shell: bash
        run: |
          # 用假安装包验证更新清单生成脚本
          mkdir -p tmp-artifacts
          for f in DownVid-Setup-0.0.0.exe DownVid-arm64-Mac-0.0.0.zip DownVid-x64-Mac-0.0.0.zip DownVid-x86_64-Linux-0.0.0.AppImage DownVid-amd64-Linux-0.0.0.deb DownVid-arm64-Linux-0.0.0.AppImage; do
            echo "$f" > "tmp-artifacts/$f"
          done
          node scripts/gen-update-manifests.mjs tmp-artifacts 0.0.0
          grep -q "DownVid-amd64-Linux-0.0.0.deb" tmp-artifacts/latest-linux.yml
          grep -q "DownVid-x64-Mac-0.0.0.zip" tmp-artifacts/latest-mac.yml
