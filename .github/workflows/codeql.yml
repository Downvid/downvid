name: CodeQL

# 静态安全扫描：TypeScript（前端契约层 / 发布脚本 / 官网）与 Go（核心 + 边车）。
# 目的不是替代评审，而是拦住注入、路径穿越、不安全反序列化这类可模式化识别的问题
# ——本项目会构造子进程参数并写本地文件，这两类正是重点。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:00 UTC 扫一次：上游规则库更新后能发现历史代码里的新问题
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: 分析 ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # 上传扫描结果需要 security-events: write；其余保持最小权限
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # 仓库存两个独立的 Go 模块（backend/ 边车、app/ 核心），
      # 用 manual 显式构建，避免 autobuild 在仓库根找不到模块
      - name: Build Go modules
        if: matrix.language == 'go'
        shell: bash
        run: |
          (cd backend && go build ./...)
          (cd app && go build ./...)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
