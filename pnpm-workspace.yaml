packages:
  - '.'
# pnpm 11 要求对每个带 install 脚本的依赖显式表态（未表态直接 exit 1，
# 报 ERR_PNPM_IGNORED_BUILDS）。只有 esbuild 需要跑脚本（下载平台二进制）；
# 其余是 ws 的可选原生模块，用不上但必须表态，否则 CI 的干净安装会红。
allowBuilds:
  # ws 的可选原生加速模块：装上也只是提升 WebSocket 吞吐，本仓库跑不到，
  # 明确关掉（pnpm 11 里「未表态」= 直接 exit 1，CI 会红）
  bufferutil: false
  utf-8-validate: false
  esbuild: true
